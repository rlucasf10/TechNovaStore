inhibit_rules:
  # Inhibir alertas de warning cuando hay alertas críticas del mismo servicio
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']
  
  # Inhibir alertas de Campaign Manager cuando el servicio está caído
  - source_match:
      alertname: 'CampaignManagerServiceDown'
    target_match:
      service: 'campaign-manager'
    equal: ['service']
  
  # Inhibir alertas de cron job cuando el servicio está caído
  # Requirement 16.8: No enviar alertas de cron job si el servicio no está disponible
  - source_match:
      alertname: 'CampaignManagerServiceDown'
    target_match_re:
      alertname: 'Campaign.*CronJob.*'
    equal: ['service']
  
  # Inhibir alertas de cron job lento cuando hay fallos múltiples
  - source_match:
      alertname: 'CampaignCronJobMultipleFailures'
    target_match:
      alertname: 'CampaignCronJobSlow'
    equal: ['service', 'job_type']

