# Configuración de Alertmanager para TechNovaStore
# Incluye rutas específicas para Campaign Manager Service
# Requirement 16.8: Integración con Alertmanager para notificaciones de cron job

global:
  resolve_timeout: 5m
  # Configuración de SMTP (descomentar y configurar para producción)
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@technovastore.com'
  # smtp_auth_username: 'alertmanager'
  # smtp_auth_password: 'password'

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'  # Receptor por defecto (nulo para staging)
  
  routes:
    # Rutas específicas para Campaign Manager Service
    # Requirement 16.8: Enviar notificaciones cuando cron job falla
    - match:
        service: campaign-manager
      receiver: 'campaign-manager-alerts'
      group_by: ['alertname', 'cron_job']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        # Alertas críticas de cron job (fallos de activación/desactivación)
        # Requirement 16.8: Notificaciones inmediatas cuando cron job falla
        - match_re:
            alertname: 'Campaign.*CronJob.*'
          match:
            severity: critical
          receiver: 'campaign-cron-job-critical'
          group_by: ['alertname', 'cron_job', 'error_type']
          group_wait: 0s
          repeat_interval: 10m
        
        # Alertas de warning de cron job (lentitud, no ejecución)
        - match_re:
            alertname: 'Campaign.*CronJob.*'
          match:
            severity: warning
          receiver: 'campaign-cron-job-alerts'
          group_wait: 30s
          repeat_interval: 1h
        
        # Otras alertas críticas de Campaign Manager
        - match:
            severity: critical
          receiver: 'campaign-manager-critical'
          group_wait: 0s
          repeat_interval: 15m
        
        # Alertas de warning de Campaign Manager
        - match:
            severity: warning
          receiver: 'campaign-manager-alerts'
          repeat_interval: 2h
    
    # Rutas generales por severidad
    - match:
        severity: critical
      receiver: 'null'
    - match:
        severity: warning
      receiver: 'null'

receivers:
  # Receptor nulo que no envía notificaciones (para staging/desarrollo)
  - name: 'null'
  
  # Receptor para alertas generales de Campaign Manager
  # En producción, configurar con webhook, email, Slack, etc.
  - name: 'campaign-manager-alerts'
    # Webhook para notificaciones (descomentar y configurar para producción)
