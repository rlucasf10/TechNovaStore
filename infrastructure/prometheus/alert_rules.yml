groups:
  - name: technovastore_alerts
    rules:
      # Service Health Alerts
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value }} errors per second on {{ $labels.job }}"

      # Performance Alerts
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time on {{ $labels.job }}"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.job }}"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.job }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.job }}"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 512
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "Memory usage is {{ $value }}MB on {{ $labels.job }}"

      # Database Alerts
      - alert: MongoDBConnectionsHigh
        expr: mongodb_connections{state="current"} > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MongoDB connections are high"
          description: "MongoDB has {{ $value }} active connections"

      - alert: PostgreSQLConnectionsHigh
        expr: pg_stat_database_numbackends > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections are high"
          description: "PostgreSQL has {{ $value }} active connections"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is {{ $value }}%"

      # Business Logic Alerts
      - alert: OrderProcessingDelay
        expr: increase(orders_processing_time_seconds_sum[10m]) / increase(orders_processing_time_seconds_count[10m]) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order processing is slow"
          description: "Average order processing time is {{ $value }}s"

      - alert: SyncEngineFailures
        expr: increase(sync_engine_failures_total[10m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sync engine has multiple failures"
          description: "Sync engine has {{ $value }} failures in the last 10 minutes"

      - alert: AutoPurchaseFailures
        expr: increase(auto_purchase_failures_total[10m]) > 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Auto purchase system has failures"
          description: "Auto purchase has {{ $value }} failures in the last 10 minutes"

      # Campaign Manager Alerts
      # Requirement 16.7: Alertas cuando una campaña falla al activarse o desactivarse
      
      - alert: CampaignManagerServiceDown
        expr: up{job="campaign-manager-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: campaign-manager
        annotations:
          summary: "Campaign Manager Service is down"
          description: "Campaign Manager Service has been down for more than 1 minute. Campaign activation/deactivation will not work."

      - alert: CampaignActivationFailure
        expr: increase(http_requests_total{job="campaign-manager-service", path=~".*apply-discounts.*", status=~"5.."}[10m]) > 0
        for: 1m
        labels:
          severity: critical
          service: campaign-manager
        annotations:
          summary: "Campaign activation failed"
          description: "Campaign discount application has failed {{ $value }} times in the last 10 minutes. Check logs for details."

      - alert: CampaignDeactivationFailure
        expr: increase(http_requests_total{job="campaign-manager-service", path=~".*remove-discounts.*", status=~"5.."}[10m]) > 0
        for: 1m
        labels:
          severity: critical
          service: campaign-manager
        annotations:
          summary: "Campaign deactivation failed"
          description: "Campaign discount removal has failed {{ $value }} times in the last 10 minutes. Check logs for details."

      - alert: CampaignDiscountProcessingSlow
        expr: histogram_quantile(0.95, rate(campaign_discount_application_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          service: campaign-manager
        annotations:
          summary: "Campaign discount processing is slow"
          description: "95th percentile of campaign discount processing time is {{ $value }}s, which exceeds the 30s threshold."

      - alert: CampaignManagerHighErrorRate
        expr: rate(http_requests_total{job="campaign-manager-service", status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: campaign-manager
        annotations:
          summary: "High error rate on Campaign Manager Service"
          description: "Campaign Manager Service has {{ $value }} errors per second."

      - alert: NoCampaignsActive
        expr: campaign_active_count == 0
        for: 24h
        labels:
          severity: info
          service: campaign-manager
        annotations:
          summary: "No active campaigns"
          description: "There have been no active campaigns for 24 hours. This may be intentional or indicate a configuration issue."

      # Requirement 16.8: Alertas cuando cron job falla
      
      # Alerta cuando el cron job de activación falla
      - alert: CampaignActivationCronJobFailure
        expr: increase(campaign_cron_job_failures_total{job="campaign-manager-service", job_type="activation"}[1h]) > 0
        for: 1m
        labels:
          severity: critical
          service: campaign-manager
          cron_job: activation
        annotations:
          summary: "Campaign activation cron job failed"
          description: "Campaign activation cron job has failed {{ $value }} times in the last hour. Campaigns may not be activating automatically. Error type: {{ $labels.error_type }}"

      # Alerta cuando el cron job de desactivación falla
      - alert: CampaignDeactivationCronJobFailure
        expr: increase(campaign_cron_job_failures_total{job="campaign-manager-service", job_type="deactivation"}[1h]) > 0
        for: 1m
        labels:
          severity: critical
          service: campaign-manager
          cron_job: deactivation
        annotations:
          summary: "Campaign deactivation cron job failed"
          description: "Campaign deactivation cron job has failed {{ $value }} times in the last hour. Campaigns may not be deactivating automatically. Error type: {{ $labels.error_type }}"

      # Alerta cuando el cron job no se ha ejecutado en más de 2 horas
      - alert: CampaignCronJobNotRunning
        expr: (time() - campaign_cron_job_last_execution_timestamp{job="campaign-manager-service"}) > 7200
        for: 5m
        labels:
          severity: warning
          service: campaign-manager
        annotations:
          summary: "Campaign cron job not running"
          description: "Campaign {{ $labels.job_type }} cron job has not executed in over 2 hours. Last execution was {{ $value | humanizeDuration }} ago."

      # Alerta cuando el cron job tarda demasiado
      - alert: CampaignCronJobSlow
        expr: histogram_quantile(0.95, rate(campaign_cron_job_duration_seconds_bucket{job="campaign-manager-service"}[1h])) > 120
        for: 5m
        labels:
          severity: warning
          service: campaign-manager
        annotations:
          summary: "Campaign cron job is slow"
          description: "Campaign {{ $labels.job_type }} cron job 95th percentile duration is {{ $value }}s, which exceeds the 120s threshold."

      # Alerta cuando hay múltiples fallos consecutivos del cron job
      - alert: CampaignCronJobMultipleFailures
        expr: increase(campaign_cron_job_failures_total{job="campaign-manager-service"}[3h]) >= 3
        for: 1m
        labels:
          severity: critical
          service: campaign-manager
        annotations:
          summary: "Multiple campaign cron job failures"
          description: "Campaign {{ $labels.job_type }} cron job has failed {{ $value }} times in the last 3 hours. Immediate attention required."