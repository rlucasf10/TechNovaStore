name: Automated Deployment Pipeline

# ============================================================================
# DESHABILITADO: Los deploys automáticos requieren servidores configurados
# ============================================================================
# Este workflow solo se ejecuta manualmente.
# Para desarrollo local, usa: docker-compose -f docker-compose.optimized.yml up -d
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (requiere servidor configurado)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      confirm:
        description: '¿Tienes el servidor y secrets configurados?'
        required: true
        type: boolean
        default: false

jobs:
  check-requirements:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'true'
    steps:
    - name: Verify secrets
      run: |
        echo "⚠️ Este workflow requiere configuración de servidor"
        echo ""
        echo "Secrets necesarios para ${{ github.event.inputs.environment }}:"
        echo "- ${{ github.event.inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION' }}_SSH_KEY"
        echo "- ${{ github.event.inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION' }}_HOST"
        echo "- ${{ github.event.inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION' }}_USER"
        echo "- Credenciales de bases de datos"
        echo ""
        echo "Si no tienes estos secrets configurados, el deploy fallará."

  notify-disabled:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm != 'true'
    steps:
    - name: Show message
      run: |
        echo "❌ Deploy cancelado"
        echo ""
        echo "Para usar este workflow necesitas:"
        echo "1. Un servidor VPS con Docker instalado"
        echo "2. Configurar los secrets en GitHub Settings > Secrets"
        echo ""
        echo "Para desarrollo local, usa:"
        echo "  docker-compose -f docker-compose.optimized.yml up -d"
