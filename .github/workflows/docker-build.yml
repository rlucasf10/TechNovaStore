name: Docker Build and Push

# ============================================================================
# DESHABILITADO: Build de imágenes Docker para registry
# ============================================================================
# Este workflow construye y sube imágenes a GitHub Container Registry.
# Solo es útil si planeas desplegar en un servidor remoto.
# 
# Para desarrollo local, usa directamente:
#   docker-compose -f docker-compose.optimized.yml up -d --build
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Servicio a construir (o "all" para todos)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api-gateway
          - frontend
          - product-service
          - user-service
          - order-service
          - payment-service
          - notification-service
          - chatbot
          - recommender

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-info:
    runs-on: ubuntu-latest
    steps:
    - name: Build Information
      run: |
        echo "## Docker Build Info" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Este workflow construye imágenes Docker y las sube a GitHub Container Registry." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Servicio seleccionado:** ${{ github.event.inputs.service }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Para desarrollo local, no necesitas este workflow. Usa:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker-compose -f docker-compose.optimized.yml up -d --build" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
