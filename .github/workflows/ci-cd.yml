name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint and Type Check
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install root dependencies
      run: npm ci --ignore-scripts || npm install --ignore-scripts

    - name: Run ESLint
      run: npm run lint --if-present || echo "No lint script found"

  # Test Job - Solo tests unitarios básicos
  test:
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: technovastore_test
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgresql:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: technovastore_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --ignore-scripts || npm install --ignore-scripts

    - name: Run tests
      run: npm test --if-present || echo "No test script found"
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://admin:password@localhost:27017/technovastore_test?authSource=admin
        POSTGRESQL_URI: postgresql://admin:password@localhost:5432/technovastore_test
        REDIS_URI: redis://localhost:6379
        JWT_SECRET: test-jwt-secret-for-ci

  # Build verification - Solo verifica que los Dockerfiles son válidos
  build-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify Dockerfiles exist
      run: |
        echo "Checking Dockerfiles..."
        for dockerfile in \
          "domains/platform/api-gateway/Dockerfile" \
          "domains/catalog/product-service/Dockerfile" \
          "domains/commerce/order-service/Dockerfile" \
          "domains/customer/user-service/Dockerfile" \
          "domains/commerce/payment-service/Dockerfile" \
          "domains/customer/notification-service/Dockerfile" \
          "domains/support/ticket-service/Dockerfile" \
          "domains/catalog/sync-engine/Dockerfile" \
          "domains/commerce/auto-purchase-service/Dockerfile" \
          "domains/support/shipment-tracker/Dockerfile" \
          "domains/support/chatbot-service/Dockerfile" \
          "domains/catalog/recommender-service/Dockerfile" \
          "domains/platform/frontend/Dockerfile"
        do
          if [ -f "$dockerfile" ]; then
            echo "✅ $dockerfile exists"
          else
            echo "⚠️ $dockerfile not found"
          fi
        done

    - name: Validate docker-compose files
      run: |
        docker-compose -f docker-compose.yml config > /dev/null && echo "✅ docker-compose.yml is valid"
        docker-compose -f docker-compose.optimized.yml config > /dev/null && echo "✅ docker-compose.optimized.yml is valid"

  # Security scan básico
  security-check:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security audit
      run: npm audit --audit-level=critical || echo "Security audit completed with warnings"

    - name: Check for secrets in code
      run: |
        echo "Checking for potential secrets..."
        # Buscar patrones comunes de secretos (excluyendo archivos de ejemplo)
        if grep -rE "(password|secret|api_key|apikey).*=.*['\"][^'\"]{8,}['\"]" \
          --include="*.ts" --include="*.js" --include="*.json" \
          --exclude-dir=node_modules \
          --exclude="*.example*" \
          --exclude="*.test.*" \
          . 2>/dev/null | grep -v "process.env" | grep -v "example" | head -5; then
          echo "⚠️ Potential hardcoded secrets found (review manually)"
        else
          echo "✅ No obvious hardcoded secrets found"
        fi

  # Summary job
  ci-summary:
    runs-on: ubuntu-latest
    needs: [lint, test, build-check, security-check]
    if: always()
    
    steps:
    - name: CI Summary
      run: |
        echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Check | ${{ needs.build-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Check | ${{ needs.security-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
