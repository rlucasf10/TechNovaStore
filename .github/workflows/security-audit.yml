name: Security Audit

on:
  schedule:
    # Ejecutar auditoría de seguridad semanalmente los lunes a las 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      run_full_audit:
        description: 'Ejecutar auditoría completa'
        required: false
        type: boolean
        default: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Security Audit Summary
      run: |
        echo "## 🔒 Security Audit Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Fecha:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Check .gitignore for sensitive files
      run: |
        echo "### 📋 Verificación de .gitignore" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        ISSUES=0
        
        # Verificar que .env está en .gitignore
        if grep -q "^\.env" .gitignore 2>/dev/null; then
          echo "✅ Archivos .env están en .gitignore" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Archivos .env deberían estar en .gitignore" >> $GITHUB_STEP_SUMMARY
          ISSUES=$((ISSUES+1))
        fi
        
        # Verificar que node_modules está en .gitignore
        if grep -q "node_modules" .gitignore 2>/dev/null; then
          echo "✅ node_modules está en .gitignore" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ node_modules debería estar en .gitignore" >> $GITHUB_STEP_SUMMARY
          ISSUES=$((ISSUES+1))
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Problemas encontrados:** $ISSUES" >> $GITHUB_STEP_SUMMARY

    - name: Check for sensitive files in repository
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔍 Archivos sensibles en el repositorio" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Buscar archivos .env (excepto .example)
        ENV_FILES=$(find . -type f -name ".env*" ! -name "*.example" ! -path "./node_modules/*" 2>/dev/null | head -10)
        
        if [ -n "$ENV_FILES" ]; then
          echo "⚠️ Archivos .env encontrados:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$ENV_FILES" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No se encontraron archivos .env sensibles" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Check for hardcoded credentials patterns
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔐 Verificación de credenciales hardcodeadas" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Buscar patrones de credenciales (solo en archivos trackeados por git)
        # Excluimos archivos que están en .gitignore
        FOUND=$(git ls-files | xargs grep -lE "(GOCSPX-|sk_live_|pk_live_|ghp_|gho_|github_pat_)" 2>/dev/null | head -5) || true
        
        if [ -n "$FOUND" ]; then
          echo "⚠️ Posibles credenciales encontradas en archivos trackeados:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$FOUND" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Nota:** Revisar manualmente estos archivos" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No se encontraron patrones de credenciales conocidos" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Final Summary
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Auditoría de seguridad completada" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Esta auditoría se ejecuta automáticamente cada lunes." >> $GITHUB_STEP_SUMMARY
        echo "Para ejecutar manualmente, usa el botón 'Run workflow' en la pestaña Actions." >> $GITHUB_STEP_SUMMARY

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: critical
        allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD
