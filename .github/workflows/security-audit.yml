name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security audit weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --ignore-scripts || npm install --ignore-scripts
      continue-on-error: true
      
    - name: Run security audit
      run: |
        echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Run audit and capture output
        npm audit --audit-level=critical 2>&1 | tee audit-output.txt || true
        
        # Check for critical vulnerabilities
        if grep -q "critical" audit-output.txt; then
          echo "⚠️ **Critical vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat audit-output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No critical vulnerabilities found" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Check for secrets in code
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Secrets Check" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for common secret patterns
        if grep -rE "(password|secret|api_key|apikey|private_key).*=.*['\"][^'\"]{20,}['\"]" \
          --include="*.ts" --include="*.js" --include="*.json" \
          --exclude-dir=node_modules \
          --exclude="*.example*" \
          --exclude="*.test.*" \
          --exclude="*.spec.*" \
          . 2>/dev/null | grep -v "process.env" | head -10; then
          echo "⚠️ Potential hardcoded secrets found (review manually)" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No obvious hardcoded secrets detected" >> $GITHUB_STEP_SUMMARY
        fi

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: critical
        allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD
