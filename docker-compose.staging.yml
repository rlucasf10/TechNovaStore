# ============================================================================
# TechNovaStore - Docker Compose Staging (Desarrollo Local con Variables)
# ============================================================================
# 
# PROPÓSITO:
#   Configuración para desarrollo local usando variables de entorno.
#   Basado en docker-compose.optimized.yml pero con credenciales desde .env
#
# USO:
#   docker-compose -f docker-compose.staging.yml up -d
#
# CARACTERÍSTICAS:
#   - Credenciales desde .env
#   - CON límites de recursos (RAM/CPU)
#   - Todos los puertos expuestos
#   - NODE_ENV: production (configurado en .env)
#   - Healthchecks habilitados
#
# ENTORNO: Desarrollo Local (8GB RAM)
# REQUISITOS: 8GB RAM mínimo, archivo .env.docker configurado
# ============================================================================

services:
  # Databases
  mongodb:
    image: mongo:8.0
    container_name: technovastore-mongodb
    restart: unless-stopped
    ports:
      - "27088:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: technovastore
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/mongodb/init:/docker-entrypoint-initdb.d
    networks:
      - technovastore-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postgresql:
    image: postgres:15
    container_name: technovastore-postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: technovastore
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./infrastructure/postgresql/init:/docker-entrypoint-initdb.d
    networks:
      - technovastore-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: technovastore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - technovastore-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ELK Stack for Logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: technovastore-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: technovastore-logstash
    restart: unless-stopped
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx128m -Xms128m"
    volumes:
      - ./infrastructure/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./infrastructure/logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      - technovastore-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: technovastore-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: false
    volumes:
      - ./infrastructure/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    networks:
      - technovastore-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Ollama (AI Service)
  ollama:
    image: ollama/ollama:latest
    container_name: technovastore-ollama
    restart: unless-stopped
    ports:
      - "8434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./infrastructure/ollama/init-ollama.sh:/init-ollama.sh
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 10
        chmod +x /init-ollama.sh
        /init-ollama.sh
        wait

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./domains/platform/api-gateway/Dockerfile
    image: technovastore-api-gateway:latest
    container_name: technovastore-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/technovastore?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      PRODUCT_SERVICE_URL: http://product-service:3000
      ORDER_SERVICE_URL: http://order-service:3000
      USER_SERVICE_URL: http://user-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      TICKET_SERVICE_URL: http://ticket-service:3005
      SYNC_ENGINE_URL: http://sync-engine:3000
      AUTO_PURCHASE_URL: http://auto-purchase:3000
      SHIPMENT_TRACKER_URL: http://shipment-tracker:3000
      CHATBOT_URL: http://chatbot:3001
      RECOMMENDER_URL: http://recommender:3000
      CORS_ORIGIN: ${FRONTEND_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      # OAuth Configuration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    depends_on:
      - mongodb
      - redis
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: ./domains/catalog/product-service/Dockerfile
    image: technovastore-product-service:latest
    container_name: technovastore-product-service
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/technovastore?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NODE_OPTIONS: "--max-old-space-size=1536"
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - mongodb
      - redis
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: ./domains/commerce/order-service/Dockerfile
    image: technovastore-order-service:latest
    container_name: technovastore-order-service
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: technovastore
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_OPTIONS: --max-old-space-size=1280
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    depends_on:
      - postgresql
      - redis
      - notification-service
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # User Service
  user-service:
    build:
      context: .
      dockerfile: ./domains/customer/user-service/Dockerfile
    image: technovastore-user-service:latest
    container_name: technovastore-user-service
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: technovastore
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      # OAuth Configuration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      # Aumentar memoria para tests
      NODE_OPTIONS: "--max-old-space-size=768"
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - postgresql
      - redis
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: ./domains/commerce/payment-service/Dockerfile
    image: technovastore-payment-service:latest
    container_name: technovastore-payment-service
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: technovastore
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
      ORDER_SERVICE_URL: http://order-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    depends_on:
      - postgresql
      - redis
      - notification-service
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: ./domains/customer/notification-service/Dockerfile
    image: technovastore-notification-service:latest
    container_name: technovastore-notification-service
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: technovastore
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - postgresql
      - redis
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # Campaign Manager Service
  campaign-manager-service:
    build:
      context: .
      dockerfile: ./domains/commerce/campaign-manager-service/Dockerfile
    image: technovastore-campaign-manager:latest
    container_name: technovastore-campaign-manager
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3011
      DATABASE_URL: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgresql:5432/technovastore
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: technovastore
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_OPTIONS: "--max-old-space-size=512"
    depends_on:
      - postgresql
      - product-service
      - notification-service
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3011/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # Sync Engine
  sync-engine:
    build:
      context: .
      dockerfile: ./domains/catalog/sync-engine/Dockerfile
    image: technovastore-sync-engine:latest
    container_name: technovastore-sync-engine
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/technovastore?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NODE_OPTIONS: "--max-old-space-size=768"
      AMAZON_API_KEY: ${AMAZON_API_KEY}
      ALIEXPRESS_API_KEY: ${ALIEXPRESS_API_KEY}
      EBAY_API_KEY: ${EBAY_API_KEY}
      BANGGOOD_API_KEY: ${BANGGOOD_API_KEY}
      NEWEGG_API_KEY: ${NEWEGG_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - mongodb
      - redis
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Auto Purchase
  auto-purchase:
    build:
      context: .
      dockerfile: ./domains/commerce/auto-purchase-service/Dockerfile
    image: technovastore-auto-purchase:latest
    container_name: technovastore-auto-purchase
    restart: unless-stopped
    ports:
      - "3007:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: technovastore
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - postgresql
      - redis
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Shipment Tracker
  shipment-tracker:
    build:
      context: .
      dockerfile: ./domains/support/shipment-tracker/Dockerfile
    image: technovastore-shipment-tracker:latest
    container_name: technovastore-shipment-tracker
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: technovastore
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_OPTIONS: "--max-old-space-size=768"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    depends_on:
      - postgresql
      - redis
      - notification-service
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Chatbot
  chatbot:
    build:
      context: .
      dockerfile: ./domains/support/chatbot-service/Dockerfile
    image: technovastore-chatbot:latest
    container_name: technovastore-chatbot
    restart: unless-stopped
    ports:
      - "3009:3001"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: ${NODE_ENV}
      CHATBOT_PORT: 3001
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/technovastore?authSource=admin
      FRONTEND_URL: ${FRONTEND_URL}
      TICKET_SERVICE_URL: ${TICKET_SERVICE_URL}
      # AI Provider: 'gemini' | 'ollama' | 'fallback'
      AI_PROVIDER: ${AI_PROVIDER}
      # Gemini Configuration
      USE_GEMINI: ${USE_GEMINI}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE}
      GEMINI_MAX_TOKENS: ${GEMINI_MAX_TOKENS}
      # Ollama Configuration (backup)
      USE_OLLAMA: ${USE_OLLAMA}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - mongodb
      - ticket-service
      - ollama
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Recommender
  recommender:
    build:
      context: .
      dockerfile: ./domains/catalog/recommender-service/Dockerfile
    image: technovastore-recommender:latest
    container_name: technovastore-recommender
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/technovastore?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NODE_OPTIONS: "--max-old-space-size=1536"
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - mongodb
      - redis
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Ticket Service
  ticket-service:
    build:
      context: .
      dockerfile: ./domains/support/ticket-service/Dockerfile
    image: technovastore-ticket-service:latest
    container_name: technovastore-ticket-service
    restart: unless-stopped
    ports:
      - "3012:3005"
    environment:
      NODE_ENV: ${NODE_ENV}
      TICKET_SERVICE_PORT: 3005
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: technovastore
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - postgresql
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend
  frontend:
    image: technovastore-frontend:latest
    build:
      context: ./domains/platform/frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CHATBOT_URL: ${NEXT_PUBLIC_CHATBOT_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: technovastore-frontend
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CHATBOT_URL: ${NEXT_PUBLIC_CHATBOT_URL}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      INTERNAL_API_URL: http://api-gateway:3000/api
      # OAuth Configuration
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID}
      # Analytics (deshabilitado en desarrollo)
      NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      # Configuración de memoria para Node.js (MUY reducida)
      NODE_OPTIONS: "--max-old-space-size=512"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api-gateway
    networks:
      - technovastore-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: technovastore-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - technovastore-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:10.2.0
    container_name: technovastore-grafana
    restart: unless-stopped
    ports:
      - "3013:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - technovastore-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Database Exporters
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: technovastore-mongodb-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    environment:
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/technovastore?authSource=admin
    command:
      - '--mongodb.uri=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017'
      - '--mongodb.collstats-colls=products,categories,users'
    networks:
      - technovastore-network
    depends_on:
      - mongodb
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: technovastore-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgresql:5432/technovastore?sslmode=disable
    networks:
      - technovastore-network
    depends_on:
      - postgresql
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: technovastore-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - technovastore-network
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: technovastore-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - technovastore-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: technovastore-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - technovastore-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  mongodb_data:
  postgresql_data:
  redis_data:
  elasticsearch_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  technovastore-network:
    driver: bridge
